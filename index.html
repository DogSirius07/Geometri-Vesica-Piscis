<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Portfólio</title>
  
  <!-- Importando o Tailwind CSS direto da nuvem (Sem instalação) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- ================= MENU (NAVBAR) ================= -->
  <nav class="bg-gray-900 text-white p-4 shadow-lg sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="#" class="text-2xl font-bold tracking-wider text-blue-400">
        MeuPortfólio.
      </a>
      
      <!-- Menu Desktop -->
      <div class="hidden md:flex space-x-6">
        <a href="#" class="hover:text-blue-400 transition">Início</a>
        <a href="#projetos" class="hover:text-blue-400 transition">Projetos</a>
        <a href="#sobre" class="hover:text-blue-400 transition">Sobre</a>
      </div>

      <!-- Botão Menu Mobile -->
      <button id="menu-btn" class="md:hidden text-white focus:outline-none text-2xl">
        ☰
      </button>
    </div>

    <!-- Menu Mobile Retrátil -->
    <div id="mobile-menu" class="hidden md:hidden mt-4 space-y-2 flex-col items-center pb-4">
      <a href="#" class="block py-2 hover:text-blue-400 text-center w-full">Início</a>
      <a href="#projetos" class="block py-2 hover:text-blue-400 text-center w-full">Projetos</a>
      <a href="#sobre" class="block py-2 hover:text-blue-400 text-center w-full">Sobre</a>
    </div>
  </nav>

  <!-- ================= PÁGINA DE PROJETOS ================= -->
  <section id="projetos" class="min-h-screen py-16 px-4">
    <div class="max-w-6xl mx-auto">
      <div class="mb-12 text-center">
        <h1 class="text-4xl font-extrabold text-gray-900 mb-4">Meus Projetos</h1>
        <p class="text-gray-600">
          Uma coleção dos meus trabalhos anteriores e desenvolvimentos recentes.
        </p>
      </div>

      <!-- Onde os projetos aparecerão dinamicamente -->
      <div id="grid-projetos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- Os cards serão injetados aqui pelo JavaScript -->
      </div>
    </div>
  </section>

  <!-- ================= LÓGICA JAVASCRIPT ================= -->
  <script>
    // 1. Lógica para abrir/fechar o menu no celular
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');

    menuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
      mobileMenu.classList.toggle('flex');
    });

    // 2. Seus Dados de Projetos (Adicione os antigos aqui!)
    const projetos = [
      {
        titulo: "Projeto Moderno 1",
        descricao: "Este é o modelo do seu novo projeto, com design atualizado.",
        tecnologias: ["HTML", "Tailwind CDN", "JS Puro"],
        link: "#",
        imagem: "https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=600&h=400&fit=crop"
      },
      {
        titulo: "Projeto Antigo (Reimaginado)",
        descricao: "Descrição do seu projeto das frequências anteriores.",
        tecnologias: ["HTML", "CSS", "Lógica"],
        link: "#",
        imagem: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=600&h=400&fit=crop"
      },
      {
        titulo: "Sistema de Frequência",
        descricao: "Projeto desenvolvido na disciplina anterior.",
        tecnologias: ["JavaScript", "DOM", "CSS"],
        link: "#",
        imagem: "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=600&h=400&fit=crop"
      }
    ];

    // 3. Renderizar os projetos na tela automaticamente
    const gridProjetos = document.getElementById('grid-projetos');

    projetos.forEach(projeto => {
      // Gera as tags de tecnologia
      const tagsHtml = projeto.tecnologias.map(tech => 
        `<span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">${tech}</span>`
      ).join('');

      // Cria o HTML do Card
      const cardHtml = `
        <div class="bg-white rounded-xl shadow-md hover:shadow-2xl transition duration-300 overflow-hidden transform hover:-translate-y-2">
          <img src="${projeto.imagem}" alt="${projeto.titulo}" class="w-full h-48 object-cover" />
          <div class="p-6">
            <h3 class="text-2xl font-bold text-gray-800 mb-2">${projeto.titulo}</h3>
            <p class="text-gray-600 mb-4 h-12 overflow-hidden">${projeto.descricao}</p>
            <div class="flex flex-wrap gap-2 mb-4">
              ${tagsHtml}
            </div>
            <a href="${projeto.link}" class="inline-block bg-blue-600 text-white font-medium px-4 py-2 rounded hover:bg-blue-700 transition">
              Ver Projeto Completo &rarr;
            </a>
          </div>
        </div>
      `;

      // Insere o card na página
      gridProjetos.innerHTML += cardHtml;
    });
  </script>
</body>
</html>
