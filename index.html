<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aria Central - Autenticação Híbrida</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            cyan: '#00f0ff',
                            purple: '#b026ff',
                            dark: '#030712'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-[#030712] text-gray-900 dark:text-gray-100 min-h-screen flex items-center justify-center transition-colors duration-300 relative">

    <!-- Botão Flutuante de Modo Noturno / Claro -->
    <button id="themeToggle" class="absolute top-6 right-6 p-3 rounded-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-lg hover:scale-105 transition flex items-center justify-center" aria-label="Alternar tema">
        <!-- Ícone do Sol (Visível no modo escuro) -->
        <svg id="sunIcon" class="w-5 h-5 text-amber-400 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m3.343-5.657l-.707-.707m12.728 12.728l-.707-.707M6.343 17.657l-.707.707m12.728-12.728l-.707.707M12 5a7 7 0 100 14 7 7 0 000-14z"></path></svg>
        <!-- Ícone da Lua (Visível no modo claro) -->
        <svg id="moonIcon" class="w-5 h-5 text-gray-700 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
    </button>

    <!-- Container Principal do Login -->
    <div class="w-full max-w-md p-8 bg-white dark:bg-[#0a0f19] border border-gray-200 dark:border-white/10 rounded-2xl shadow-xl dark:shadow-[0_10px_40px_rgba(0,0,0,0.8)] backdrop-blur-xl transition-all">
        
        <div class="text-center mb-8">
            <h1 class="text-2xl font-extrabold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-500 to-purple-600">ARIA<span class="text-cyan-400">.OS</span></h1>
            <p class="text-xs font-mono text-gray-500 mt-1 uppercase tracking-wider">Painel de Autenticação Segura</p>
        </div>

        <form id="loginForm" class="space-y-5" novalidate>
            <div>
                <label for="login" class="block text-xs font-mono uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-2">Usuário ou E-mail</label>
                <input type="text" id="login" name="login" required placeholder="Digite seu usuário" class="w-full px-4 py-3 bg-gray-50 dark:bg-black/50 border border-gray-300 dark:border-white/20 rounded-xl text-sm focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition font-mono">
            </div>
            
            <div class="relative">
                <label for="senha" class="block text-xs font-mono uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-2">Chave de Acesso</label>
                <input type="password" id="senha" name="senha" required placeholder="••••••••" class="w-full px-4 py-3 pr-12 bg-gray-50 dark:bg-black/50 border border-gray-300 dark:border-white/20 rounded-xl text-sm focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition font-mono">
                
                <!-- Botão de Mostrar/Ocultar Senha -->
                <button type="button" id="togglePassword" class="absolute right-3 top-9 text-gray-500 hover:text-cyan-400 transition" aria-label="Mostrar ou ocultar senha">
                    👁️
                </button>
                
                <div id="errorMessage" class="text-red-500 text-xs font-mono mt-2 hidden">A senha deve ter pelo menos 8 caracteres.</div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-purple-600 text-white font-mono text-xs font-bold uppercase tracking-[2px] rounded-xl hover:opacity-95 shadow-lg shadow-cyan-500/20 transition active:scale-[0.98]">
                Autenticar
            </button>

            <div class="text-center mt-4">
                <a href="#" class="text-xs font-mono text-cyan-600 dark:text-cyan-400 hover:underline tracking-wide">Esqueci minha senha</a>
            </div>
        </form>
    </div>

    <!-- Script de Funcionalidades (Tema, Visibilidade e Validação) -->
    <script>
        // 1. Lógica do Modo Noturno / Claro
        const themeToggleBtn = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        themeToggleBtn.addEventListener('click', () => {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        });

        // 2. Alternar Visibilidade da Senha
        const togglePasswordBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('senha');

        togglePasswordBtn.addEventListener('click', () => {
            const currentType = passwordInput.getAttribute('type');
            const newType = currentType === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', newType);
            togglePasswordBtn.textContent = newType === 'password' ? '👁️' : '🙈';
        });

        // 3. Validação de Tamanho (Mínimo 8 caracteres)
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', (e) => {
            if (passwordInput.value.length < 8) {
                e.preventDefault(); // Impede o envio do formulário
                passwordInput.classList.add('border-red-500');
                errorMessage.style.display = 'block';
                passwordInput.focus();
            } else {
                passwordInput.classList.remove('border-red-500');
                errorMessage.style.display = 'none';
            }
        });

        // Remove o erro automaticamente enquanto o usuário digita uma senha válida
        passwordInput.addEventListener('input', () => {
            if (passwordInput.value.length >= 8) {
                passwordInput.classList.remove('border-red-500');
                errorMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
