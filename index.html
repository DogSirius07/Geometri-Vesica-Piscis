<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Portfólio Dinâmico</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

  <!-- Navbar -->
  <nav class="bg-gray-900 text-white p-4 shadow-lg sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="#" class="text-2xl font-bold text-blue-400">Portfólio.</a>
      <div class="hidden md:flex space-x-6">
        <a href="#" class="hover:text-blue-400">Início</a>
        <a href="#projetos" class="hover:text-blue-400">Projetos</a>
      </div>
    </div>
  </nav>

  <!-- Seção de Projetos -->
  <section id="projetos" class="min-h-screen py-16 px-4">
    <div class="max-w-6xl mx-auto">
      <div class="mb-8 text-center">
        <h1 class="text-4xl font-extrabold text-gray-900 mb-4">Meus Projetos</h1>
        
        <!-- Barra de Busca Dinâmica -->
        <div class="max-w-md mx-auto mt-6">
          <input 
            type="text" 
            id="barra-busca" 
            placeholder="Digite uma tecnologia (ex: React, JavaScript)..." 
            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm"
          >
        </div>
      </div>

      <!-- Grid Vazio (Preenchido pelo JS) -->
      <div id="grid-projetos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <p class="text-gray-500 col-span-full text-center">Carregando projetos...</p>
      </div>
    </div>
  </section>

  <!-- Lógica Dinâmica -->
  <script>
    let todosOsProjetos = [];
    const gridProjetos = document.getElementById('grid-projetos');
    const barraBusca = document.getElementById('barra-busca');

    // 1. Função que busca os dados no arquivo JSON
    async function carregarProjetos() {
      try {
        const resposta = await fetch('projetos.json');
        todosOsProjetos = await resposta.json();
        renderizarProjetos(todosOsProjetos);
      } catch (erro) {
        gridProjetos.innerHTML = `<p class="text-red-500 col-span-full text-center">Erro ao carregar os projetos. Verifique se o arquivo projetos.json existe.</p>`;
      }
    }

    // 2. Função que desenha os projetos na tela
    function renderizarProjetos(listaDeProjetos) {
      gridProjetos.innerHTML = ''; // Limpa a tela

      if (listaDeProjetos.length === 0) {
        gridProjetos.innerHTML = `<p class="text-gray-500 col-span-full text-center">Nenhum projeto encontrado.</p>`;
        return;
      }

      listaDeProjetos.forEach(projeto => {
        const tagsHtml = projeto.tecnologias.map(tech => 
          `<span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">${tech}</span>`
        ).join('');

        const card = `
          <div class="bg-white rounded-xl shadow-md hover:shadow-xl transition duration-300 overflow-hidden">
            <img src="${projeto.imagem}" alt="${projeto.titulo}" class="w-full h-48 object-cover" />
            <div class="p-6">
              <h3 class="text-xl font-bold text-gray-800 mb-2">${projeto.titulo}</h3>
              <p class="text-gray-600 mb-4 h-12 overflow-hidden text-sm">${projeto.descricao}</p>
              <div class="flex flex-wrap gap-2 mb-4">${tagsHtml}</div>
              <a href="${projeto.link}" class="text-blue-600 font-semibold hover:underline">Ver Projeto &rarr;</a>
            </div>
          </div>
        `;
        gridProjetos.innerHTML += card;
      });
    }

    // 3. Evento de Filtro Dinâmico (dispara a cada letra digitada)
    barraBusca.addEventListener('input', (evento) => {
      const termoDigitado = evento.target.value.toLowerCase();
      
      const projetosFiltrados = todosOsProjetos.filter(projeto => {
        const tituloBate = projeto.titulo.toLowerCase().includes(termoDigitado);
        const tecnologiaBate = projeto.tecnologias.some(tech => tech.toLowerCase().includes(termoDigitado));
        return tituloBate || tecnologiaBate;
      });

      renderizarProjetos(projetosFiltrados);
    });

    // Inicia o carregamento ao abrir a página
    carregarProjetos();
  </script>
</body>
</html>
