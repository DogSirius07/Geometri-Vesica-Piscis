<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acervo de Projetos Especiais</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Cores inspiradas no seu código original */
    body { background-color: #050a14; color: #ffffff; }
    .glass-card {
      background: rgba(15, 20, 35, 0.94);
      border: 1px solid rgba(160, 102, 255, 0.4);
      backdrop-filter: blur(16px);
    }
    .text-gradient {
      background: linear-gradient(135deg, #fff, #00d4ff, #a066ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tag-glow {
      background: rgba(0, 212, 255, 0.15);
      border: 1px solid #00d4ff;
      color: #e0f7ff;
    }
  </style>
</head>
<body class="font-sans min-h-screen">

  <!-- Navbar -->
  <nav class="border-b border-purple-900/50 bg-[#050a14]/90 backdrop-blur-md sticky top-0 z-50 p-4 shadow-[0_4px_30px_rgba(0,0,0,0.5)]">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="#" class="text-2xl font-serif font-bold text-gradient">✦ Nossa História</a>
      <div class="hidden md:flex space-x-6 text-sm font-semibold tracking-wider text-yellow-500">
        <a href="#" class="hover:text-white transition">INÍCIO</a>
        <a href="#projetos" class="hover:text-white transition">ACERVO</a>
      </div>
    </div>
  </nav>

  <!-- Seção de Projetos -->
  <section id="projetos" class="py-16 px-4">
    <div class="max-w-6xl mx-auto">
      <div class="mb-12 text-center">
        <h1 class="text-4xl md:text-5xl font-serif font-extrabold text-gradient mb-4">Acervo de Projetos Especiais</h1>
        <p class="text-yellow-500 text-sm tracking-[2px] uppercase">Todas as nossas frequências em um só lugar</p>
        
        <!-- Barra de Busca Dinâmica -->
        <div class="max-w-lg mx-auto mt-8">
          <input 
            type="text" 
            id="barra-busca" 
            placeholder="Buscar por módulo ou tecnologia (ex: Balão, Chart.js)..." 
            class="w-full px-5 py-3 rounded-xl bg-black/50 border border-purple-500 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#00d4ff] focus:border-transparent transition"
          >
        </div>
      </div>

      <!-- Grid dos Projetos -->
      <div id="grid-projetos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- Preenchido pelo JavaScript -->
      </div>
    </div>
  </section>

  <!-- Lógica Dinâmica -->
  <script>
    // Agora o banco de dados está direto aqui no código, então não tem como o navegador bloquear!
    const todosOsProjetos = [
      {
        id: 1,
        titulo: "O Balão de Emoções",
        descricao: "Um espaço interativo em 3D para soltar ansiedades e pensamentos ao vento. Módulo especial para alívio emocional.",
        tecnologias: ["Three.js", "Animação 3D", "JavaScript"],
        link: "#",
        imagem: "https://images.unsplash.com/photo-1507608616759-54f48f0af0ee?w=600&h=400&fit=crop"
      },
      {
        id: 2,
        titulo: "Nossa Frequência",
        descricao: "Módulo de acolhimento com frequências de cura (432Hz, 528Hz, Ruído Marrom) e respiração guiada.",
        tecnologias: ["Web Audio API", "CSS Animations"],
        link: "#",
        imagem: "https://images.unsplash.com/photo-1518241353330-0f797f6cceea?w=600&h=400&fit=crop"
      },
      {
        id: 3,
        titulo: "Projeto Guardião",
        descricao: "Diário de saúde para monitoramento de glicemia e pressão arterial com geração de gráficos dinâmicos e exportação de logs.",
        tecnologias: ["Chart.js", "LocalStorage", "Exportação TXT"],
        link: "#",
        imagem: "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=600&h=400&fit=crop"
      },
      {
        id: 4,
        titulo: "Projeto Aria AI",
        descricao: "Assistente virtual integrada ao sistema com respostas personalizadas dependendo do nível de acesso (Guardião, Namorada, Mãe).",
        tecnologias: ["Inteligência Lógica", "DOM Manipulation"],
        link: "#",
        imagem: "https://images.unsplash.com/photo-1620712943543-bcc4688e7485?w=600&h=400&fit=crop"
      },
      {
        id: 5,
        titulo: "Cápsula do Tempo",
        descricao: "Sistema de mensagens secretas que só podem ser abertas em datas futuras, integrado a um relógio de relacionamento.",
        tecnologias: ["JavaScript Dates", "LocalStorage"],
        link: "#",
        imagem: "https://images.unsplash.com/photo-1501139083538-0139583c060f?w=600&h=400&fit=crop"
      },
      {
        id: 6,
        titulo: "Controle de Acesso Restrito",
        descricao: "Painel central do sistema com bloqueio por senhas específicas que liberam módulos diferentes dependendo de quem acessa.",
        tecnologias: ["Segurança Lógica", "Renderização Condicional"],
        link: "#",
        imagem: "https://images.unsplash.com/photo-1510511459019-5d26af37f394?w=600&h=400&fit=crop"
      }
    ];

    const gridProjetos = document.getElementById('grid-projetos');
    const barraBusca = document.getElementById('barra-busca');

    // Função que desenha os projetos na tela
    function renderizarProjetos(listaDeProjetos) {
      gridProjetos.innerHTML = ''; // Limpa a tela

      if (listaDeProjetos.length === 0) {
        gridProjetos.innerHTML = `<p class="text-gray-400 col-span-full text-center">Nenhum projeto encontrado nesta frequência.</p>`;
        return;
      }

      listaDeProjetos.forEach(projeto => {
        const tagsHtml = projeto.tecnologias.map(tech => 
          `<span class="tag-glow text-[10px] font-bold px-2 py-1 rounded-md uppercase tracking-wider">${tech}</span>`
        ).join('');

        const card = `
          <div class="glass-card rounded-2xl overflow-hidden hover:shadow-[0_0_20px_rgba(160,102,255,0.3)] transition duration-300 transform hover:-translate-y-1 flex flex-col h-full">
            <img src="${projeto.imagem}" alt="${projeto.titulo}" class="w-full h-48 object-cover opacity-80 hover:opacity-100 transition" />
            <div class="p-6 flex flex-col flex-grow">
              <h3 class="text-xl font-serif font-bold text-[#ffd700] mb-3">${projeto.titulo}</h3>
              <p class="text-gray-300 mb-5 flex-grow text-sm leading-relaxed">${projeto.descricao}</p>
              <div class="flex flex-wrap gap-2 mb-6">${tagsHtml}</div>
              <button onclick="alert('Sistema Guardião: Acesso restrito via senha no sistema principal.')" class="mt-auto w-full bg-gradient-to-r from-purple-600 to-blue-500 text-white font-bold py-3 rounded-xl hover:scale-[0.98] transition">
                Acessar Módulo
              </button>
            </div>
          </div>
        `;
        gridProjetos.innerHTML += card;
      });
    }

    // Evento de Filtro Dinâmico
    barraBusca.addEventListener('input', (evento) => {
      const termoDigitado = evento.target.value.toLowerCase();
      
      const projetosFiltrados = todosOsProjetos.filter(projeto => {
        const tituloBate = projeto.titulo.toLowerCase().includes(termoDigitado);
        const tecnologiaBate = projeto.tecnologias.some(tech => tech.toLowerCase().includes(termoDigitado));
        const descricaoBate = projeto.descricao.toLowerCase().includes(termoDigitado);
        return tituloBate || tecnologiaBate || descricaoBate;
      });

      renderizarProjetos(projetosFiltrados);
    });

    // Inicia o carregamento assim que a página abre
    renderizarProjetos(todosOsProjetos);
  </script>
</body>
</html>
