<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acervo de Projetos Especiais</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(-45deg, #050a14, #0f172a, #1a0b2e, #050a14);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #ffffff;
      overflow-x: hidden;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .glass-card {
      background: rgba(15, 20, 35, 0.7);
      border: 1px solid rgba(160, 102, 255, 0.3);
      backdrop-filter: blur(12px);
    }
    
    .text-gradient {
      background: linear-gradient(135deg, #fff, #00d4ff, #a066ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tag-glow {
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid rgba(0, 212, 255, 0.5);
      color: #e0f7ff;
    }

    .animate-fade-in {
      animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      opacity: 0;
      transform: translateY(30px);
    }
    @keyframes fadeIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .btn-filtro { transition: all 0.3s ease; }
    .btn-filtro.ativo {
      background: rgba(160, 102, 255, 0.3);
      border-color: #a066ff;
      box-shadow: 0 0 15px rgba(160, 102, 255, 0.4);
    }

    /* Nova Animação: Tremer ao errar a senha */
    .shake {
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0) scale(1); }
      20%, 80% { transform: translate3d(2px, 0, 0) scale(1); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0) scale(1); }
      40%, 60% { transform: translate3d(4px, 0, 0) scale(1); }
    }
  </style>
</head>
<body class="font-sans min-h-screen flex flex-col">

  <nav class="border-b border-purple-900/40 bg-[#050a14]/60 backdrop-blur-xl sticky top-0 z-40 p-4">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="#" class="text-2xl font-serif font-bold text-gradient tracking-wide">✦ Nossa História</a>
      <div class="hidden md:flex space-x-6 text-sm font-semibold tracking-[2px] text-[#ffd700]">
        <a href="#" class="hover:text-white transition drop-shadow-[0_0_8px_rgba(255,215,0,0.5)]">INÍCIO</a>
        <a href="#projetos" class="hover:text-white transition">SISTEMAS</a>
      </div>
    </div>
  </nav>

  <section id="projetos" class="py-16 px-4 flex-grow">
    <div class="max-w-6xl mx-auto">
      <div class="mb-12 text-center">
        <h1 class="text-4xl md:text-5xl font-serif font-extrabold text-gradient mb-4">Acervo de Projetos Especiais</h1>
        <p class="text-[#00d4ff] text-sm tracking-[3px] uppercase opacity-80">Conectado à IA Aria v2.0</p>
        
        <div class="max-w-2xl mx-auto mt-8">
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-purple-500">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </span>
            <input type="text" id="barra-busca" placeholder="Buscar por módulo, tecnologia ou sentimento..." class="w-full pl-12 pr-5 py-4 rounded-xl glass-card text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#a066ff] transition">
          </div>
        </div>

        <div class="flex flex-wrap justify-center gap-3 mt-6" id="container-filtros">
          <button onclick="aplicarFiltro('Todos', this)" class="btn-filtro ativo px-4 py-1.5 rounded-full border border-gray-600 text-sm font-medium text-gray-300 hover:text-white">Todos</button>
          <button onclick="aplicarFiltro('Emoções', this)" class="btn-filtro px-4 py-1.5 rounded-full border border-gray-600 text-sm font-medium text-gray-300 hover:text-white">Emoções</button>
          <button onclick="aplicarFiltro('Saúde', this)" class="btn-filtro px-4 py-1.5 rounded-full border border-gray-600 text-sm font-medium text-gray-300 hover:text-white">Saúde</button>
          <button onclick="aplicarFiltro('Memórias', this)" class="btn-filtro px-4 py-1.5 rounded-full border border-gray-600 text-sm font-medium text-gray-300 hover:text-white">Memórias</button>
          <button onclick="aplicarFiltro('Sistema', this)" class="btn-filtro px-4 py-1.5 rounded-full border border-gray-600 text-sm font-medium text-gray-300 hover:text-white">Sistema</button>
        </div>
      </div>

      <div id="grid-projetos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- Renderizado via JS -->
      </div>
    </div>
  </section>

  <!-- Modal de Segurança Evoluído: Agora pede senha! -->
  <div id="modal-seguranca" class="fixed inset-0 z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 backdrop-blur-md bg-black/80">
    <div class="glass-card p-8 rounded-2xl max-w-sm w-full mx-4 border-purple-500/50 shadow-[0_0_40px_rgba(160,102,255,0.2)] transform scale-95 transition-transform duration-300" id="modal-content">
      
      <!-- Botão fechar (X) no topo -->
      <button onclick="fecharModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>

      <div class="flex justify-center mb-4">
        <div class="w-16 h-16 rounded-full bg-purple-900/40 flex items-center justify-center border border-purple-500/50" id="icone-cadeado">
          <svg class="w-8 h-8 text-[#00d4ff]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        </div>
      </div>
      
      <h2 class="text-2xl font-serif font-bold text-white text-center mb-1">Acesso Restrito</h2>
      <p id="nome-modulo-modal" class="text-[#ffd700] text-center text-sm font-semibold tracking-wider mb-4 uppercase">Módulo</p>
      
      <p class="text-gray-400 text-center text-sm mb-6 leading-relaxed">O Sistema Guardião exige validação de identidade. Insira a credencial da <span class="text-[#00d4ff]">Aria</span>.</p>
      
      <!-- Campo de Senha -->
      <div class="mb-4">
        <input type="password" id="input-senha" placeholder="Digite a chave..." class="w-full bg-black/50 border border-gray-600 rounded-lg px-4 py-3 text-center text-white tracking-[0.3em] focus:outline-none focus:border-[#00d4ff] focus:ring-1 focus:ring-[#00d4ff] transition">
        <p id="msg-erro" class="text-red-400 text-xs text-center mt-2 opacity-0 transition-opacity">Credencial inválida. Tentativa registrada.</p>
      </div>

      <button onclick="verificarSenha()" class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white font-bold py-3 rounded-xl hover:scale-[0.98] transition shadow-[0_0_15px_rgba(0,212,255,0.4)]">
        Autenticar
      </button>
    </div>
  </div>

  <script>
    const todosOsProjetos = [
      { id: 1, titulo: "O Balão de Emoções", categoria: "Emoções", descricao: "Um espaço interativo em 3D para soltar ansiedades e pensamentos ao vento.", tecnologias: ["Three.js", "Animação 3D", "JavaScript"], link: "balao.html", imagem: "https://images.unsplash.com/photo-1507608616759-54f48f0af0ee?w=600&h=400&fit=crop" },
      { id: 2, titulo: "Nossa Frequência", categoria: "Emoções", descricao: "Módulo de acolhimento com frequências de cura (432Hz, 528Hz) e respiração.", tecnologias: ["Web Audio API", "CSS Animations"], link: "frequencia.html", imagem: "https://images.unsplash.com/photo-1518241353330-0f797f6cceea?w=600&h=400&fit=crop" },
      { id: 3, titulo: "Projeto Guardião", categoria: "Saúde", descricao: "Diário de saúde para monitoramento de glicemia e pressão arterial.", tecnologias: ["Chart.js", "LocalStorage"], link: "guardiao.html", imagem: "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=600&h=400&fit=crop" },
      { id: 4, titulo: "Projeto Aria AI", categoria: "Sistema", descricao: "Assistente virtual integrada ao sistema com respostas personalizadas.", tecnologias: ["Inteligência Lógica", "DOM Manipulation"], link: "aria.html", imagem: "https://images.unsplash.com/photo-1620712943543-bcc4688e7485?w=600&h=400&fit=crop" },
      { id: 5, titulo: "Cápsula do Tempo", categoria: "Memórias", descricao: "Sistema de mensagens secretas que só podem ser abertas em datas futuras.", tecnologias: ["JavaScript Dates", "LocalStorage"], link: "capsula.html", imagem: "https://images.unsplash.com/photo-1501139083538-0139583c060f?w=600&h=400&fit=crop" },
      { id: 6, titulo: "Acesso Restrito", categoria: "Sistema", descricao: "Painel central do sistema com bloqueio por senhas específicas.", tecnologias: ["Segurança Lógica", "React"], link: "painel.html", imagem: "https://images.unsplash.com/photo-1510511459019-5d26af37f394?w=600&h=400&fit=crop" }
    ];

    const gridProjetos = document.getElementById('grid-projetos');
    const barraBusca = document.getElementById('barra-busca');
    let filtroAtual = 'Todos';

    function renderizarProjetos(listaDeProjetos) {
      gridProjetos.innerHTML = ''; 
      if (listaDeProjetos.length === 0) {
        gridProjetos.innerHTML = `<div class="col-span-full text-center py-12 animate-fade-in"><p class="text-gray-400 text-lg">Aria não encontrou registros para esta busca.</p></div>`;
        return;
      }

      listaDeProjetos.forEach((projeto, index) => {
        const tagsHtml = projeto.tecnologias.map(tech => `<span class="tag-glow text-[10px] font-bold px-2 py-1 rounded-md uppercase tracking-wider">${tech}</span>`).join('');
        const delay = index * 100; 

        const card = `
          <div class="glass-card rounded-2xl overflow-hidden hover:shadow-[0_0_30px_rgba(160,102,255,0.4)] transition duration-500 transform hover:-translate-y-2 flex flex-col h-full animate-fade-in" style="animation-delay: ${delay}ms;">
            <div class="relative overflow-hidden group">
              <img src="${projeto.imagem}" alt="${projeto.titulo}" class="w-full h-48 object-cover opacity-70 group-hover:opacity-100 group-hover:scale-110 transition duration-700" />
              <div class="absolute top-3 right-3 bg-black/60 backdrop-blur-md px-3 py-1 rounded-full border border-gray-500/30">
                <span class="text-xs text-gray-200 font-semibold tracking-wider">${projeto.categoria}</span>
              </div>
            </div>
            <div class="p-6 flex flex-col flex-grow relative z-10">
              <h3 class="text-xl font-serif font-bold text-[#ffd700] mb-3">${projeto.titulo}</h3>
              <p class="text-gray-300 mb-5 flex-grow text-sm leading-relaxed">${projeto.descricao}</p>
              <div class="flex flex-wrap gap-2 mb-6">${tagsHtml}</div>
              
              <!-- Aqui passamos o Nome e o Link para o Modal saber qual abrir -->
              <button onclick="abrirModal('${projeto.titulo}', '${projeto.link}')" class="mt-auto w-full relative overflow-hidden group bg-gradient-to-r from-purple-600/80 to-blue-600/80 hover:from-purple-500 hover:to-blue-500 text-white font-bold py-3 rounded-xl transition duration-300 border border-purple-400/30">
                <span class="relative z-10 flex items-center justify-center gap-2">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                  Acessar Módulo
                </span>
              </button>
            </div>
          </div>
        `;
        gridProjetos.innerHTML += card;
      });
    }

    // --- LÓGICA DO NOVO SISTEMA DE SENHAS ---
    const modal = document.getElementById('modal-seguranca');
    const modalContent = document.getElementById('modal-content');
    const inputSenha = document.getElementById('input-senha');
    const msgErro = document.getElementById('msg-erro');
    const nomeModuloModal = document.getElementById('nome-modulo-modal');
    
    let moduloDestino = ''; // Guarda pra onde ir se a senha estiver certa
    const SENHA_SECRETA = "aria2026"; // MUDAR A SENHA AQUI SE QUISER!

    function abrirModal(nomeProjeto, linkProjeto) {
      moduloDestino = linkProjeto;
      nomeModuloModal.innerText = `Destino: ${nomeProjeto}`;
      inputSenha.value = ''; // limpa o campo
      msgErro.classList.add('opacity-0'); // esconde o erro
      
      modal.classList.remove('opacity-0', 'pointer-events-none');
      modal.classList.add('opacity-100');
      modalContent.classList.remove('scale-95');
      modalContent.classList.add('scale-100');
      
      // Foca automaticamente no campo de senha
      setTimeout(() => inputSenha.focus(), 100);
    }

    function fecharModal() {
      modal.classList.add('opacity-0', 'pointer-events-none');
      modal.classList.remove('opacity-100');
      modalContent.classList.add('scale-95');
      modalContent.classList.remove('scale-100');
    }

    function verificarSenha() {
      const senhaDigitada = inputSenha.value;

      if (senhaDigitada === SENHA_SECRETA) {
        // SENHA CORRETA! Muda a cor para verde e "redireciona"
        document.getElementById('icone-cadeado').innerHTML = `<svg class="w-8 h-8 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path></svg>`;
        document.getElementById('icone-cadeado').classList.replace('border-purple-500/50', 'border-green-500');
        msgErro.innerText = "Acesso concedido. Iniciando...";
        msgErro.classList.replace('text-red-400', 'text-green-400');
        msgErro.classList.remove('opacity-0');
        
        // Simula um delay e redireciona (aqui é só um alert de sucesso, mas você pode usar window.location.href)
        setTimeout(() => {
          alert("Sucesso! Você destrancou e seria redirecionado para: " + moduloDestino);
          fecharModal();
          // window.location.href = moduloDestino; // <- Remova as barras // para funcionar de verdade depois
        }, 1200);

      } else {
        // SENHA ERRADA! Tremer modal e exibir erro
        msgErro.classList.remove('opacity-0');
        modalContent.classList.remove('shake');
        // Hack para reiniciar a animação CSS
        void modalContent.offsetWidth; 
        modalContent.classList.add('shake');
        inputSenha.value = '';
      }
    }

    // Permite apertar "Enter" para verificar a senha
    inputSenha.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        verificarSenha();
      }
    });

    // Fecha clicando fora
    modal.addEventListener('click', (e) => {
      if(e.target === modal) fecharModal();
    });

    function aplicarFiltro(categoria, elementoBotao) {
      filtroAtual = categoria;
      document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('ativo'));
      elementoBotao.classList.add('ativo');
      filtrarProjetos();
    }

    function filtrarProjetos() {
      const termoDigitado = barraBusca.value.toLowerCase();
      const projetosFiltrados = todosOsProjetos.filter(projeto => {
        const bateCategoria = filtroAtual === 'Todos' || projeto.categoria === filtroAtual;
        const tituloBate = projeto.titulo.toLowerCase().includes(termoDigitado);
        const tecnologiaBate = projeto.tecnologias.some(tech => tech.toLowerCase().includes(termoDigitado));
        const descricaoBate = projeto.descricao.toLowerCase().includes(termoDigitado);
        const bateTexto = tituloBate || tecnologiaBate || descricaoBate;
        return bateCategoria && bateTexto;
      });
      renderizarProjetos(projetosFiltrados);
    }

    barraBusca.addEventListener('input', filtrarProjetos);
    renderizarProjetos(todosOsProjetos);
  </script>
</body>
</html>
