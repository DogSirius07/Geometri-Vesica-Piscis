<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Autenticação</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .input-group {
            margin-bottom: 15px;
            position: relative;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            padding-right: 40px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .input-group input.error {
            border-color: #dc3545;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 32px;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 18px;
            color: #666;
        }
        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        .btn-auth {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .btn-auth:hover {
            background-color: #0056b3;
        }
        .forgot-password {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #007bff;
            text-decoration: none;
        }
        .forgot-password:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Login</h2>
    <form action="#" method="POST" id="loginForm">
        <div class="input-group">
            <label for="login">Usuário ou E-mail</label>
            <input type="text" id="login" name="login" required placeholder="Digite seu login">
        </div>
        
        <div class="input-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required placeholder="Digite sua senha">
            <button type="button" id="togglePassword" class="toggle-password" aria-label="Mostrar ou ocultar senha">👁️</button>
            <div id="errorMessage" class="error-message">A senha deve ter pelo menos 8 caracteres.</div>
        </div>

        <button type="submit" class="btn-auth">Autenticar</button>
        <a href="#" class="forgot-password">Esqueci minha senha</a>
    </form>
</div>

<script>
    // Alternar visibilidade da senha
    const togglePasswordButton = document.querySelector('#togglePassword');
    const passwordInput = document.querySelector('#senha');

    togglePasswordButton.addEventListener('click', function () {
        const currentType = passwordInput.getAttribute('type');
        const newType = currentType === 'password' ? 'text' : 'password';
        
        passwordInput.setAttribute('type', newType);
        this.textContent = newType === 'password' ? '👁️' : '🙈';
    });

    // Validação do formulário no envio
    const loginForm = document.querySelector('#loginForm');
    const errorMessage = document.querySelector('#errorMessage');

    loginForm.addEventListener('submit', function (event) {
        const senhaValor = passwordInput.value;

        // Verifica se a senha tem menos de 8 caracteres
        if (senhaValor.length < 8) {
            // Impede o envio do formulário
            event.preventDefault();
            
            // Adiciona classe de erro no input e exibe a mensagem
            passwordInput.classList.add('error');
            errorMessage.style.display = 'block';
            passwordInput.focus();
        } else {
            // Remove o erro caso esteja válido
            passwordInput.classList.remove('error');
            errorMessage.style.display = 'none';
        }
    });

    // Limpa o erro dinamicamente enquanto o usuário digita uma senha válida
    passwordInput.addEventListener('input', function () {
        if (passwordInput.value.length >= 8) {
            passwordInput.classList.remove('error');
            errorMessage.style.display = 'none';
        }
    });
</script>

</body>
</html>
